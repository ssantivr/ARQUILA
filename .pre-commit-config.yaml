repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-format
        files: ^(backend|scripts)/
      - id: ruff-check
        args: [--fix]
        files: ^(backend|scripts)/

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: node
        additional_dependencies: ["prettier@3.9.9"]
        entry: prettier --write --ignore-unknown
        files: ^frontend/(src/.*|vite\.config\.ts|eslint\.config\.js)$
