name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the tools
        run: |
          pip install -r backend/requirements-dev.txt
          npm ci --prefix frontend
      - name: Check lint and formatting
        run: python scripts/quality.py

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arquila_test
          POSTGRES_USER: arquila
          POSTGRES_PASSWORD: arquila
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arquila -d arquila_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with SQLite
        run: pytest
      - name: Run tests with PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://arquila:arquila@localhost:5432/arquila_test
        run: pytest

  frontend:
    name: Frontend (tests and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check types and build
        run: npm run build
