name: CI

on:
  push:
    branches: [santiago, main]
  pull_request:

jobs:
  data-structures:
    name: Data structures (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run each structure
        run: |
          set -e
          for source in data_structures/*/*.cpp; do
            binary="/tmp/$(basename "$source" .cpp)"
            g++ -std=c++17 -Wall "$source" -o "$binary"
            "$binary" > /dev/null
          done

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arquila_test
          POSTGRES_USER: arquila
          POSTGRES_PASSWORD: arquila
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arquila -d arquila_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with SQLite
        run: pytest
      - name: Run tests with PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://arquila:arquila@localhost:5432/arquila_test
        run: pytest

  frontend:
    name: Frontend (tests and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check types and build
        run: npm run build
